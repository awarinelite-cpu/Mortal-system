<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortal System — Coordinate Input Parser</title>
  <style>
    :root {
      --bg:#f5f5f0; --panel:#fff; --ink:#111; --muted:#555; --line:#d7d1c7; --accent:#111; --danger:#b11; --ok:#0a7a0a; --warn:#9a6a00;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:Georgia, serif; background:var(--bg); color:var(--ink);
      padding:20px;
    }
    .wrap { max-width:900px; margin:0 auto; }
    .panel { background:var(--panel); border:2px solid var(--line); padding:18px; margin-bottom:18px; }
    .title { font-size:12px; letter-spacing:4px; text-transform:uppercase; margin-bottom:12px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { margin-bottom:12px; }
    label { display:block; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    input, button { font:inherit; }
    input {
      width:100%; border:1px solid var(--line); background:#fff; padding:10px 12px; color:var(--ink);
      border-bottom:2px solid var(--muted); font-size:16px;
    }
    input:focus { border-color:var(--accent); outline:none; }
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab { border:1px solid var(--line); background:#f2f1ec; color:var(--muted); padding:8px 14px; cursor:pointer; }
    .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .row { display:flex; gap:10px; align-items:flex-end; }
    .btn {
      border:1px solid var(--line); background:#f7f5f1; color:var(--ink); padding:10px 14px; cursor:pointer; font-weight:700;
    }
    .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .status {
      margin-top:10px; padding:9px 12px; font-size:11px; letter-spacing:2px; text-transform:uppercase; border:1px solid var(--line); background:#f2f1ec;
    }
    .status.ok { border-color:var(--ok); background:rgba(10,122,10,0.08); color:var(--ok); }
    .status.err { border-color:var(--danger); background:rgba(177,17,17,0.08); color:var(--danger); }
    .out { margin-top:14px; background:#faf8f4; border:1px solid var(--line); padding:12px; }
    .out strong { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
    .out .coord { font-size:22px; margin-top:8px; }
    .muted { color:var(--muted); }
    @media (max-width: 700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">Coordinate parser</div>
      <div class="tabs">
        <button class="tab active" data-mode="dd" data-target="gun">Decimal degrees</button>
        <button class="tab" data-mode="dms" data-target="gun">DMS / DMM</button>
        <button class="tab" data-mode="mgrs" data-target="gun">MGRS</button>
      </div>
      <div class="grid">
        <div>
          <div class="panel" style="margin:0;">
            <div class="title">Gun position</div>
            <div id="gunDD" class="field-wrap">
              <div class="field">
                <label for="gunLat">Latitude</label>
                <input id="gunLat" type="text" placeholder="e.g. 6.4541 or 6°27'16.4\"N" value="6.4541" />
              </div>
              <div class="field">
                <label for="gunLng">Longitude</label>
                <input id="gunLng" type="text" placeholder="e.g. 3.3947 or 3°23'40.9\"E" value="3.3947" />
              </div>
            </div>
            <div id="gunDMS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="gunLatText">Latitude string</label>
                <input id="gunLatText" type="text" placeholder="6°27'16.4\"N" value="6°27'16.4\"N" />
              </div>
              <div class="field">
                <label for="gunLngText">Longitude string</label>
                <input id="gunLngText" type="text" placeholder="3°23'40.9\"E" value="3°23'40.9\"E" />
              </div>
            </div>
            <div id="gunMGRS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="gunMGRSInput">MGRS grid</label>
                <input id="gunMGRSInput" type="text" placeholder="32PNT1234567890" value="32PNT1234567890" />
              </div>
            </div>
            <div class="row">
              <button class="btn primary" onclick="applyManGPS()">Set gun</button>
              <button class="btn" onclick="clearGun()">Clear</button>
            </div>
            <div id="gunStatus" class="status">Awaiting GPS</div>
          </div>
        </div>

        <div>
          <div class="panel" style="margin:0;">
            <div class="title">Target coordinates</div>
            <div class="tabs" style="margin-bottom:10px;">
              <button class="tab active" data-mode="dd" data-target="tgt">Decimal</button>
              <button class="tab" data-mode="dms" data-target="tgt">DMS / DMM</button>
              <button class="tab" data-mode="mgrs" data-target="tgt">MGRS</button>
            </div>
            <div id="tgtDD" class="field-wrap">
              <div class="field">
                <label for="tLat">Latitude</label>
                <input id="tLat" type="text" placeholder="e.g. 6.5120" value="6.5120" />
              </div>
              <div class="field">
                <label for="tLng">Longitude</label>
                <input id="tLng" type="text" placeholder="e.g. 3.4450" value="3.4450" />
              </div>
            </div>
            <div id="tgtDMS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="tLatText">Latitude string</label>
                <input id="tLatText" type="text" placeholder="6°30'43.2\"N" value="6°30'43.2\"N" />
              </div>
              <div class="field">
                <label for="tLngText">Longitude string</label>
                <input id="tLngText" type="text" placeholder="3°26'42.0\"E" value="3°26'42.0\"E" />
              </div>
            </div>
            <div id="tgtMGRS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="tgtMGRSInput">MGRS grid</label>
                <input id="tgtMGRSInput" type="text" placeholder="32PNT1234567890" value="32PNT1234567890" />
              </div>
            </div>
            <div class="field">
              <label for="tElev">Height diff (m)</label>
              <input id="tElev" type="number" value="0" step="any`
