<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortal System — Coordinate Input Parser</title>
  <style>
    :root {
      --bg:#f5f5f0; --panel:#fff; --ink:#111; --muted:#555; --line:#d7d1c7; --accent:#111; --danger:#b11; --ok:#0a7a0a; --warn:#9a6a00;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:Georgia, serif; background:var(--bg); color:var(--ink);
      padding:20px;
    }
    .wrap { max-width:900px; margin:0 auto; }
    .panel { background:var(--panel); border:2px solid var(--line); padding:18px; margin-bottom:18px; }
    .title { font-size:12px; letter-spacing:4px; text-transform:uppercase; margin-bottom:12px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { margin-bottom:12px; }
    label { display:block; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    input, button { font:inherit; }
    input {
      width:100%; border:1px solid var(--line); background:#fff; padding:10px 12px; color:var(--ink);
      border-bottom:2px solid var(--muted); font-size:16px;
    }
    input:focus { border-color:var(--accent); outline:none; }
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab { border:1px solid var(--line); background:#f2f1ec; color:var(--muted); padding:8px 14px; cursor:pointer; }
    .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .row { display:flex; gap:10px; align-items:flex-end; }
    .btn {
      border:1px solid var(--line); background:#f7f5f1; color:var(--ink); padding:10px 14px; cursor:pointer; font-weight:700;
    }
    .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .status {
      margin-top:10px; padding:9px 12px; font-size:11px; letter-spacing:2px; text-transform:uppercase; border:1px solid var(--line); background:#f2f1ec;
    }
    .status.ok { border-color:var(--ok); background:rgba(10,122,10,0.08); color:var(--ok); }
    .status.err { border-color:var(--danger); background:rgba(177,17,17,0.08); color:var(--danger); }
    .out { margin-top:14px; background:#faf8f4; border:1px solid var(--line); padding:12px; }
    .out strong { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
    .out .coord { font-size:22px; margin-top:8px; }
    .muted { color:var(--muted); }
    @media (max-width: 700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">Coordinate parser</div>
      <div class="tabs">
        <button class="tab active" data-mode="dd" data-target="gun">Decimal degrees</button>
        <button class="tab" data-mode="dms" data-target="gun">DMS / DMM</button>
        <button class="tab" data-mode="mgrs" data-target="gun">MGRS</button>
      </div>
      <div class="grid">
        <div>
          <div class="panel" style="margin:0;">
            <div class="title">Gun position</div>
            <div id="gunDD" class="field-wrap">
              <div class="field">
                <label for="gunLat">Latitude</label>
                <input id="gunLat" type="text" placeholder="e.g. 6.4541 or 6°27'16.4\"N" value="6.4541" />
              </div>
              <div class="field">
                <label for="gunLng">Longitude</label>
                <input id="gunLng" type="text" placeholder="e.g. 3.3947 or 3°23'40.9\"E" value="3.3947" />
              </div>
            </div>
            <div id="gunDMS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="gunLatText">Latitude string</label>
                <input id="gunLatText" type="text" placeholder="6°27'16.4\"N" value="6°27'16.4\"N" />
              </div>
              <div class="field">
                <label for="gunLngText">Longitude string</label>
                <input id="gunLngText" type="text" placeholder="3°23'40.9\"E" value="3°23'40.9\"E" />
              </div>
            </div>
            <div id="gunMGRS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="gunMGRSInput">MGRS grid</label>
                <input id="gunMGRSInput" type="text" placeholder="32PNT1234567890" value="32PNT1234567890" />
              </div>
            </div>
            <div class="row">
              <button class="btn primary" onclick="applyManGPS()">Set gun</button>
              <button class="btn" onclick="clearGun()">Clear</button>
            </div>
            <div id="gunStatus" class="status">Awaiting GPS</div>
          </div>
        </div>

        <div>
          <div class="panel" style="margin:0;">
            <div class="title">Target coordinates</div>
            <div class="tabs" style="margin-bottom:10px;">
              <button class="tab active" data-mode="dd" data-target="tgt">Decimal</button>
              <button class="tab" data-mode="dms" data-target="tgt">DMS / DMM</button>
              <button class="tab" data-mode="mgrs" data-target="tgt">MGRS</button>
            </div>
            <div id="tgtDD" class="field-wrap">
              <div class="field">
                <label for="tLat">Latitude</label>
                <input id="tLat" type="text" placeholder="e.g. 6.5120" value="6.5120" />
              </div>
              <div class="field">
                <label for="tLng">Longitude</label>
                <input id="tLng" type="text" placeholder="e.g. 3.4450" value="3.4450" />
              </div>
            </div>
            <div id="tgtDMS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="tLatText">Latitude string</label>
                <input id="tLatText" type="text" placeholder="6°30'43.2\"N" value="6°30'43.2\"N" />
              </div>
              <div class="field">
                <label for="tLngText">Longitude string</label>
                <input id="tLngText" type="text" placeholder="3°26'42.0\"E" value="3°26'42.0\"E" />
              </div>
            </div>
            <div id="tgtMGRS" class="field-wrap" style="display:none;">
              <div class="field">
                <label for="tgtMGRSInput">MGRS grid</label>
                <input id="tgtMGRSInput" type="text" placeholder="32PNT1234567890" value="32PNT1234567890" />
              </div>
            </div>
            <div class="field">
              <label for="tElev">Height diff (m)</label>
              <input id="tElev" type="number" value="0" step="any" />
            </div>
            <div class="row">
              <button class="btn primary" onclick="applyTarget()">Set target</button>
              <button class="btn" onclick="clearTarget()">Clear</button>
            </div>
            <div id="tgtStatus" class="status">Awaiting target</div>
          </div>
        </div>
      </div>

      <div class="out">
        <strong>Normalized output</strong>
        <div class="coord" id="coordOut">Gun: --<br />Target: --</div>
      </div>
    </div>
  </div>

  <script>
    const DEG = (rad) => rad * 180 / Math.PI;
    const RAD = (deg) => deg * Math.PI / 180;

    function cleanCoordText(value) {
      return String(value || '').trim();
    }

    function parseDegreesOnly(raw) {
      if (raw === null || raw === undefined) return null;
      const s = cleanCoordText(raw)
        .replace(/°/g, ' ')
        .replace(/['’]/g, ' ')
        .replace(/"/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (!s) return null;
      if (/^[+-]?\d*\.?\d+(?:[eE][+-]?\d+)?$/.test(s)) {
        const n = Number(s);
        if (Number.isFinite(n)) return n;
      }
      return null;
    }

    function degFromDMSString(str) {
      const s = cleanCoordText(str)
        .replace(/°/g, ' ')
        .replace(/['’]/g, ' ')
        .replace(/"/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (!s) return null;

      const hemiMatch = s.match(/([NSEW])\s*$/i);
      const hemi = hemiMatch ? hemiMatch[1].toUpperCase() : null;
      const digits = hemi ? s.slice(0, -hemi.length).trim() : s;
      const m = digits.match(/^([+-]?\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*(\d+(?:\.\d+)?)?$/);
      if (!m) {
        const mm = digits.match(/^([+-]?\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)$/);
        if (!mm) return null;
        const d = Number(mm[1]);
        const min = Number(mm[2]);
        const val = Math.abs(d) + (min / 60);
        return (hemi === 'S' || hemi === 'W' || (digits.startsWith('-') && !hemi)) ? -val : val;
      }
      const d = Number(m[1]);
      const min = Number(m[2] || 0);
      const sec = Number(m[3] || 0);
      const val = Math.abs(d) + (min / 60) + (sec / 3600);
      const sign = (hemi === 'S' || hemi === 'W' || (d < 0 && !hemi)) ? -1 : 1;
      return sign * val;
    }

    function parseCoordinateText(raw) {
      const text = cleanCoordText(raw);
      if (!text) return null;

      if (/^[A-Z]{1,2}\d{2,}[A-Z]*\d+$/i.test(text)) {
        return parseMGRS(text);
      }

      const pair = text.split(/[;,]/);
      if (pair.length === 2) {
        const lat = parseCoordinateText(pair[0]);
        const lon = parseCoordinateText(pair[1]);
        if (lat && lon) return { lat: lat.lat ?? lat, lng: lon.lng ?? lon };
      }

      const t = text.toUpperCase();
      if (/[NSEW]/.test(t) || /°|['\"]/.test(text) || /\d\s+\d/.test(text)) {
        const v = degFromDMSString(text);
        if (v !== null) return v;
      }

      const dd = parseDegreesOnly(text);
      if (dd !== null) return dd;

      return null;
    }

    function parseMGRS(input) {
      const s = cleanCoordText(input).toUpperCase();
      if (!/^[A-Z]{1,2}\d{2,}[A-Z]*\d+$/.test(s)) return null;

      const m = s.match(/^([A-Z])([A-Z])?(\d{2,})([A-Z]{0,2})(\d+)$/);
      if (!m) return null;

      const zone = Number(m[3].slice(0, 2));
      const easting = Number(m[3].slice(2));
      const northing = Number(m[5]);
      const col = m[4] || '';
      const band = m[1];
      const latBand = band.toUpperCase();
      const c1 = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const latBands = 'CDEFGHJKLMNPQRSTUVWX';
      const bandIdx = latBands.indexOf(latBand);
      if (bandIdx < 0) return null;

      const lat = -80 + bandIdx * 8 + 4;
      const lon = (zone - 1) * 6 - 180 + 3;
      const e = easting;
      const n = northing;
      const x = 100000 + e;
      const y = 100000 + n;

      if (col) {
        const xOff = c1.indexOf(col[0]) + 1;
        const yOff = (col.length > 1) ? c1.indexOf(col[1]) + 1 : 0;
        const xCoord = x + xOff * 100000;
        const yCoord = y + yOff * 100000;
        return { lat: lat + ((yCoord % 1000000) / 1000000) * 10, lng: lon + ((xCoord % 1000000) / 1000000) * 6 };
      }

      return { lat, lng: lon };
    }

    function normalizeLatLngPair(value) {
      const parsed = parseCoordinateText(value);
      if (parsed === null) return null;
      if (typeof parsed === 'number') return { lat: parsed, lng: null };
      if (parsed && typeof parsed === 'object') return parsed;
      return null;
    }

    function isValidLat(lat) {
      return Number.isFinite(lat) && lat >= -90 && lat <= 90;
    }

    function isValidLng(lng) {
      return Number.isFinite(lng) && lng >= -180 && lng <= 180;
    }

    function fmtCoord(lat, lng) {
      return `Lat ${Number(lat).toFixed(5)}°, Lng ${Number(lng).toFixed(5)}°`;
    }

    function setStatus(el, msg, kind) {
      el.textContent = msg;
      el.classList.remove('ok', 'err');
      if (kind) el.classList.add(kind);
    }

    function setMode(target, mode) {
      const dd = document.getElementById(target + 'DD');
      const dms = document.getElementById(target + 'DMS');
      const mgrs = document.getElementById(target + 'MGRS');
      const tabs = document.querySelectorAll('.tab[data-target="' + target + '"]');

      dd.style.display = mode === 'dd' ? 'block' : 'none';
      dms.style.display = mode === 'dms' ? 'block' : 'none';
      mgrs.style.display = mode === 'mgrs' ? 'block' : 'none';
      tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.target, btn.dataset.mode));
    });

    function parseGunCoord() {
      const mode = document.querySelector('.tab.active[data-target="gun"]').dataset.mode;
      if (mode === 'mgrs') {
        const input = document.getElementById('gunMGRSInput').value;
        const parsed = parseMGRS(input);
        if (!parsed) return null;
        return parsed;
      }
      if (mode === 'dms') {
        const lat = parseCoordinateText(document.getElementById('gunLatText').value);
        const lng = parseCoordinateText(document.getElementById('gunLngText').value);
        if (lat === null || lng === null) return null;
        return { lat: Number(lat), lng: Number(lng) };
      }
      const lat = parseCoordinateText(document.getElementById('gunLat').value);
      const lng = parseCoordinateText(document.getElementById('gunLng').value);
      if (lat === null || lng === null) return null;
      return { lat: Number(lat), lng: Number(lng) };
    }

    function parseTargetCoord() {
      const mode = document.querySelector('.tab.active[data-target="tgt"]').dataset.mode;
      if (mode === 'mgrs') {
        const input = document.getElementById('tgtMGRSInput').value;
        const parsed = parseMGRS(input);
        if (!parsed) return null;
        return parsed;
      }
      if (mode === 'dms') {
        const lat = parseCoordinateText(document.getElementById('tLatText').value);
        const lng = parseCoordinateText(document.getElementById('tLngText').value);
        if (lat === null || lng === null) return null;
        return { lat: Number(lat), lng: Number(lng) };
      }
      const lat = parseCoordinateText(document.getElementById('tLat').value);
      const lng = parseCoordinateText(document.getElementById('tLng').value);
      if (lat === null || lng === null) return null;
      return { lat: Number(lat), lng: Number(lng) };
    }

    function applyManGPS() {
      const parsed = parseGunCoord();
      if (!parsed || !isValidLat(parsed.lat) || !isValidLng(parsed.lng)) {
        setStatus(document.getElementById('gunStatus'), 'invalid coordinate', 'err');
        return;
      }
      const gun = { lat: parsed.lat, lng: parsed.lng, alt: Number(document.getElementById('gunAlt')?.value || 0) };
      
      document.getElementById('coordOut').innerHTML = `Gun: <span class="muted">${fmtCoord(gun.lat, gun.lng)}</span><br />Target: --`;
      setStatus(document.getElementById('gunStatus'), 'gun coordinate accepted', 'ok');
      window.GUN = gun;
    }

    function applyTarget() {
      const parsed = parseTargetCoord();
      if (!parsed || !isValidLat(parsed.lat) || !isValidLng(parsed.lng)) {
        setStatus(document.getElementById('tgtStatus'), 'invalid coordinate', 'err');
        return;
      }
      const target = { lat: parsed.lat, lng: parsed.lng, elev: Number(document.getElementById('tElev').value || 0) };
      const gunText = window.GUN ? fmtCoord(window.GUN.lat, window.GUN.lng) : 'not set';
      document.getElementById('coordOut').innerHTML = `Gun: <span class="muted">${gunText}</span><br />Target: <span class="muted">${fmtCoord(target.lat, target.lng)}</span>`;
      setStatus(document.getElementById('tgtStatus'), 'target coordinate accepted', 'ok');
      window.TGT = target;
    }

    function clearGun() {
      document.getElementById('gunLat').value = '';
      document.getElementById('gunLng').value = '';
      document.getElementById('gunLatText').value = '';
      document.getElementById('gunLngText').value = '';
      document.getElementById('gunMGRSInput').value = '';
      setStatus(document.getElementById('gunStatus'), 'cleared', 'ok');
      delete window.GUN;
    }

    function clearTarget() {
      document.getElementById('tLat').value = '';
      document.getElementById('tLng').value = '';
      document.getElementById('tLatText').value = '';
      document.getElementById('tLngText').value = '';
      document.getElementById('tgtMGRSInput').value = '';
      setStatus(document.getElementById('tgtStatus'), 'cleared', 'ok');
      delete window.TGT;
    }

    document.getElementById('gunAlt')?.value = '0';
    document.getElementById('tElev')?.value = '0';
  </script>
</body>
</html>
